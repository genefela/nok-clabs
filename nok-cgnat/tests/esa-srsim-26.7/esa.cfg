# Diagnostic only: SR-SIM 26.7 ESA VM capability probe; not a NAT service config.
configure {
    card 1 {
        card-type xcm-1s
        mda 1 { mda-type s36-100gb-qsfp28 }
    }
    chassis router chassis-number 1 {
        power-shelf 1 {
            power-shelf-type ps-a4-shelf-dc
            power-module 1 { power-module-type ps-a-dc-6000 }
            power-module 2 { power-module-type ps-a-dc-6000 }
            power-module 3 { power-module-type ps-a-dc-6000 }
            power-module 4 { power-module-type ps-a-dc-6000 }
        }
    }
    esa 1 {
        admin-state enable
        host-port 1/1/c4/1 { }
        host-port 1/1/c5/1 { }
        vm 1 {
            admin-state enable
            vm-type bb
            cores 4
            memory 8
            host-port 1/1/c5/1
        }
    }
    isa {
        nat-group 2 {
            admin-state enable
            description "ESA capability probe only"
            redundancy { active-mda-limit 1 }
            esa 1 vm 1 { }
        }
    }
    port 1/1/c4 {
        admin-state enable
        connector { breakout c1-100g }
    }
    port 1/1/c4/1 {
        admin-state enable
        ethernet {
            mode hybrid
            encap-type dot1q
            dot1x { tunneling true }
        }
    }
    port 1/1/c5 {
        admin-state enable
        connector { breakout c1-100g }
    }
    port 1/1/c5/1 {
        admin-state enable
        ethernet {
            mode hybrid
            encap-type dot1q
            dot1x { tunneling true }
        }
    }
    system {
        name "ESA-PROBE"
        grpc {
            admin-state enable
            allow-unsecure-connection
        }
        security {
            aaa {
                local-profiles {
                    profile "administrative" {
                        default-action permit-all
                    }
                }
            }
            ssh {
                server-cipher-list-v2 {
                    cipher 190 { name aes256-ctr }
                    cipher 192 { name aes192-ctr }
                    cipher 194 { name aes128-ctr }
                }
                server-mac-list-v2 {
                    mac 200 { name hmac-sha2-512 }
                    mac 210 { name hmac-sha2-256 }
                }
            }
            user-params {
                local-user {
                    user "admin" {
                        password "$2y$10$o54xOZeJIbKM/dcTuXY7M.9qdWTkB8zGy7Q.lPJ/7mrRMuUWOqZJG"
                        restricted-to-home false
                        access {
                            console true
                            netconf true
                            grpc true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
        management-interface {
            cli {
                md-cli {
                    auto-config-save true
                }
            }
            netconf {
                listen {
                    admin-state enable
                }
            }
        }
    }
}
